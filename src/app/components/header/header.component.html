<header class="hdr">
  <nav>
    <a routerLink="/" routerLinkActive="active">Главная</a>
    @if(isLoggedIn){
      @if(isAdmin){
        <a routerLink="/admin">Admin</a>
      }@else{
        <a routerLink="/user/{{username}}">{{username}}</a>
      }
      <a (click)="logout()" routerLink="/">Выйти</a>
    } @else {
      <a routerLink="/sign-in" routerLinkActive="active">Sign in</a>
      <a routerLink="/sign-up" routerLinkActive="active">Sign Up</a>
    }

  </nav>
</header>
<hr/>
